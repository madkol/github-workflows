name: build-push-update-tag-gcp

env:
  REGISTRY: me-central2-docker.pkg.dev
  # PROJECT_ID/REPOSITORY — confirm workload_project_id once terraform.tfvars
  # is filled in; "madkhol" repository_id comes from envs/prod/main.tf
  REPO_PATH: madkhol-workload-prod/madkhol
  env_var_name_mapping: >
    {
      "prod": "production",
      "prod-gcp": "production",
      "stg": "staging",
      "dev": "development",
    }

on:
  workflow_call:
    inputs:
      # ... every existing input, unchanged from the OCI workflow — omitted
      # here for brevity. Nothing about app config differs between clouds.
      service_name:
        required: false
        type: string
      service_path:
        required: false
        type: string
      SITE_URL:
        required: false
        type: string
      BASE_API_URL:
        required: false
        type: string
      APP_BASE_URL:
        required: false
        type: string
      REACT_APP_WEBSITE_BASE_URL:
        required: false
        type: string
      SENTRY_IGNORE_ERRORS:
        required: false
        type: string
      SENTRY_DEBUG:
        required: false
        type: string
        default: 'false'
      SENTRY_TRACES_SAMPLE_RATE:
        required: false
        type: string
        default: '0.1'
      REPLAYS_ON_ERROR_SAMPLE_RATE:
        required: false
        type: string
        default: '0.1'
      REACT_APP_APPLE_PAY_VERSION_NUMBER:
        required: false
        type: string
        default: '3'
      REACT_APP_APPLE_PAY_MERCHANT_ID:
        required: false
        type: string
        default: 'madkhol'
      REACT_APP_APPLE_PAY_MERCHANT_DISPLAY:
        required: false
        type: string
        default: 'Madkhol'
      REACT_APP_SEGMENT_WRITE_KEY:
        required: false
        type: string
      REACT_APP_REGISTER_SW:
        required: false
        type: string
        default: 'true'
      REACT_APP_SENTRY_DSN:
        required: false
        type: string
      REACT_APP_SENTRY_IGNORE_ERRORS:
        required: false
        type: string
      REACT_APP_SENTRY_TRACES_SAMPLE_RATE:
        required: false
        type: string
      REACT_APP_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE:
        required: false
        type: string
      REACT_APP_SENTRY_DEBUG:
        required: false
        type: string
      REACT_APP_MICROSOFT_CLARITY:
        required: false
        type: string
      REACT_APP_GOOGLE_ANALYTICS:
        required: false
        type: string
      REACT_APP_MIXPANEL_TOKEN:
        required: false
        type: string
      REACT_APP_FIREBASE_API_KEY:
        required: false
        type: string
      REACT_APP_FIREBASE_AUTH_DOMAIN:
        required: false
        type: string
      REACT_APP_FIREBASE_PROJECT_ID:
        required: false
        type: string
      REACT_APP_FIREBASE_STORAGE_BUCKET:
        required: false
        type: string
      REACT_APP_FIREBASE_MESSAGING_SENDER_ID:
        required: false
        type: string
      REACT_APP_FIREBASE_APP_ID:
        required: false
        type: string
      REACT_APP_FIREBASE_MEASUREMENT_ID:
        required: false
        type: string
      NEXT_PUBLIC_EMAILJS_SERVICE_ID:
        required: false
        type: string
      NEXT_PUBLIC_EMAILJS_TEMPLATE_ID:
        required: false
        type: string
      NEXT_PUBLIC_EMAILJS_PUBLIC_KEY:
        required: false
        type: string
      JWT_THRIFT_ADMIN_SECRET:
        required: false
        type: string
      VITE_API_BASE_URL:
        required: false
        type: string
      VITE_APP_ENV:
        required: false
        type: string
      # <<< keep every other existing input exactly as-is >>>

    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_SERVICE_ACCOUNT:
        required: true
      INFRA_REPO_SSH_KEY:
        required: true
      NPM_TOKEN:
        required: true
      SENTRY_DSN:
        required: false
      # <<< every other existing secret (Firebase, Mixpanel, etc.) unchanged >>>

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    outputs:
      sha8: ${{ steps.get-sha8.outputs.sha8 }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Get short SHA
        id: get-sha8
        run: |
          short_sha=$(echo ${GITHUB_SHA} | cut -c1-8)
          echo "sha8=$short_sha" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_PATH }}/${{ inputs.service_name || github.event.repository.name }}

      - id: auth
        name: Authenticate to Google Cloud
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          token_format: 'access_token'
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Login to Artifact Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ${{ inputs.service_path != '' && format('./{0}', inputs.service_path) || '.' }}
          file: ${{ inputs.service_path != '' && format('./{0}/Dockerfile', inputs.service_path) || 'Dockerfile' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.REPO_PATH }}/${{ inputs.service_name || github.event.repository.name }}:${{ steps.get-sha8.outputs.sha8 }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NPM_TOKEN=${{ secrets.NPM_TOKEN }}
            SITE_URL=${{ inputs.SITE_URL }}
            BASE_API_URL=${{ inputs.BASE_API_URL }}
            APP_BASE_URL=${{ inputs.APP_BASE_URL }}
            REACT_APP_WEBSITE_BASE_URL=${{ inputs.REACT_APP_WEBSITE_BASE_URL }}
            REACT_APP_BASE_API_URL=${{ inputs.BASE_API_URL }}
            REACT_APP_ENVIRONMENT=${{ fromJSON(env.env_var_name_mapping)[github.ref_name] }}
            REACT_APP_SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            REACT_APP_SENTRY_DEBUG=${{ inputs.SENTRY_DEBUG }}
            REACT_APP_SENTRY_IGNORE_ERRORS=${{ inputs.SENTRY_IGNORE_ERRORS }}
            REACT_APP_SENTRY_TRACES_SAMPLE_RATE=${{ inputs.SENTRY_TRACES_SAMPLE_RATE }}
            REACT_APP_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE=${{ inputs.REPLAYS_ON_ERROR_SAMPLE_RATE }}
            REACT_APP_MICROSOFT_CLARITY=${{ secrets.REACT_APP_MICROSOFT_CLARITY }}
            REACT_APP_GOOGLE_ANALYTICS=${{ secrets.REACT_APP_GOOGLE_ANALYTICS }}
            REACT_APP_MIXPANEL_TOKEN=${{ secrets.REACT_APP_MIXPANEL_TOKEN }}
            REACT_APP_FIREBASE_API_KEY=${{ secrets.REACT_APP_FIREBASE_API_KEY }}
            REACT_APP_FIREBASE_AUTH_DOMAIN=${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
            REACT_APP_FIREBASE_PROJECT_ID=${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
            REACT_APP_FIREBASE_STORAGE_BUCKET=${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
            REACT_APP_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
            REACT_APP_FIREBASE_APP_ID=${{ secrets.REACT_APP_FIREBASE_APP_ID }}
            REACT_APP_FIREBASE_MEASUREMENT_ID=${{ secrets.REACT_APP_FIREBASE_MEASUREMENT_ID }}
            REACT_APP_APPLE_PAY_VERSION_NUMBER=${{ inputs.REACT_APP_APPLE_PAY_VERSION_NUMBER }}
            REACT_APP_APPLE_PAY_MERCHANT_ID=${{ inputs.REACT_APP_APPLE_PAY_MERCHANT_ID }}
            REACT_APP_APPLE_PAY_MERCHANT_DISPLAY=${{ inputs.REACT_APP_APPLE_PAY_MERCHANT_DISPLAY }}
            REACT_APP_SEGMENT_WRITE_KEY=${{ inputs.REACT_APP_SEGMENT_WRITE_KEY }}
            REACT_APP_REGISTER_SW=${{ inputs.REACT_APP_REGISTER_SW }}
            NEXT_PUBLIC_EMAILJS_SERVICE_ID=${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
            NEXT_PUBLIC_EMAILJS_TEMPLATE_ID=${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID }}
            NEXT_PUBLIC_EMAILJS_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
            JWT_THRIFT_ADMIN_SECRET=${{ secrets.JWT_THRIFT_ADMIN_SECRET }}
            VITE_API_BASE_URL=${{ inputs.VITE_API_BASE_URL }}
            VITE_APP_ENV=${{ inputs.VITE_APP_ENV }}
            NEXT_PUBLIC_EMAILJS_SOLVENCY_TEMPLATE_ID=${{ secrets.NEXT_PUBLIC_EMAILJS_SOLVENCY_TEMPLATE_ID }}

  update-tag:
    # Only ever touches helm-releases/madkhol-gcp/ — never the original
    # helm-releases/madkhol/ path. The two pipelines can never step on
    # each other, by construction, not by discipline.
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v3
        with:
          repository: madkol/Infrastructure
          ssh-key: "${{ secrets.INFRA_REPO_SSH_KEY }}"
        if: github.event_name != 'pull_request'

      - name: Split repository name
        uses: jungwinter/split@v2
        id: split-repo-name
        with:
          msg: ${{ inputs.service_name || github.event.repository.name }}
          separator: '-'
          maxsplit: '1'

      - name: Update GCP prod tag only — production-only scope, no dev/stg branch
        working-directory: GCP/helm-releases/madkhol-gcp/${{ steps.split-repo-name.outputs._1 }}
        run: |
          sed -i --regexp-extended 's|^  tag: "[a-zA-Z0-9]{4,10}"|  tag: "${{ needs.build-push.outputs.sha8 }}"|g' prod.yaml
        if: github.event_name != 'pull_request'

      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "GCP build: update image tag for helm-releases/madkhol-gcp/${{ steps.split-repo-name.outputs._1 }}"
        if: github.event_name != 'pull_request'
